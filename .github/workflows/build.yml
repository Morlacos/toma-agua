name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk TomaAgua.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TomaAgua-apk
          path: TomaAgua.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Toma Agua v1.${{ github.run_number }}
          body: "Descarga TomaAgua.apk en tu Android e instálalo. / Download TomaAgua.apk on your Android phone and install it."
          files: TomaAgua.apk
          make_latest: true
